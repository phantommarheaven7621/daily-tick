<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tick</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Tick">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15171c;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #16a34a;
    --accent-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --bar: #86efac;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #2a2f38;
      --accent: #22c55e;
      --accent-soft: #14301f;
      --danger: #f87171;
      --danger-soft: #3a1a1a;
      --bar: #166534;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px);
    max-width: 560px; margin: 0 auto;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Hero */
  .hero .day { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .hero .since { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; }
  .stat.debt .value { color: var(--danger); }
  .stat.ahead .value { color: var(--accent); }
  .progress { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 14px; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .pace { margin-top: 12px; font-size: 14px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .pill.good { background: var(--accent-soft); color: var(--accent); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }

  /* Log */
  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .datebar button { width: 40px; height: 40px; }
  .datebar .label { font-weight: 700; text-align: center; }
  .datebar .label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .daytotal { text-align: center; font-size: 14px; margin-bottom: 12px; }
  .act { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .act:first-of-type { border-top: none; }
  .act .main { flex: 1; display: flex; align-items: center; gap: 10px; background: none; border: none; color: inherit; font: inherit; text-align: left; padding: 6px 0; cursor: pointer; }
  .act .emoji { font-size: 24px; width: 32px; text-align: center; }
  .act .count { min-width: 28px; text-align: center; font-weight: 700; color: var(--muted); }
  .act .count.on { color: var(--accent); }
  button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  button:active { transform: scale(.96); }
  .round { width: 44px; height: 44px; border-radius: 12px; font-size: 22px; line-height: 1; display: grid; place-items: center; }
  .round.plus { background: var(--accent); color: #fff; border-color: transparent; }
  .round:disabled { opacity: .35; }

  /* Chart */
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; position: relative; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .bar { width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .chart .bar.zero { background: var(--danger-soft); }
  .chart .v { position: absolute; bottom: 100%; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .chart .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--danger); opacity: .7; }
  .xlabels { display: flex; gap: 4px; margin-top: 4px; }
  .xlabels span { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }

  /* Settings */
  details summary { cursor: pointer; font-weight: 600; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "›"; float: right; transition: transform .2s; color: var(--muted); }
  details[open] summary::after { transform: rotate(90deg); }
  .edit-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  input[type=text], input[type=date] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  .edit-row .e { width: 52px; text-align: center; }
  .edit-row .n { flex: 1; }
  .btn { padding: 10px 14px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .section h3 { font-size: 14px; margin: 0 0 6px; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card hero">
  <div class="day num" id="dayNum">—</div>
  <div class="since" id="since"></div>
  <div class="stats">
    <div class="stat"><div class="label">Cần có</div><div class="value num" id="required">—</div></div>
    <div class="stat"><div class="label">Đã tick</div><div class="value num" id="earned">—</div></div>
    <div class="stat" id="gapBox"><div class="label" id="gapLabel">Còn nợ</div><div class="value num" id="gap">—</div></div>
  </div>
  <div class="progress"><div id="progress"></div></div>
  <div class="pace" id="pace"></div>
</div>

<div class="card">
  <div class="datebar">
    <button id="prevDay" aria-label="Ngày trước">‹</button>
    <div class="label" id="dateLabel"></div>
    <button id="nextDay" aria-label="Ngày sau">›</button>
  </div>
  <div class="daytotal" id="dayTotal"></div>
  <div id="acts"></div>
</div>

<div class="card">
  <h2>14 ngày gần nhất</h2>
  <div class="chart" id="chart"></div>
  <div class="xlabels" id="xlabels"></div>
  <div class="muted" style="font-size:12px;margin-top:8px">Đường đỏ = 1 tick/ngày, mức tối thiểu để khoảng cách không tăng thêm.</div>
</div>

<div class="card">
  <details>
    <summary>Cài đặt</summary>

    <div class="section">
      <h3>Hoạt động</h3>
      <div class="muted" style="font-size:13px">Xoá một hoạt động sẽ ẩn nó đi, các tick cũ vẫn được giữ.</div>
      <div id="editActs"></div>
      <div class="edit-row">
        <input type="text" class="e" id="newEmoji" placeholder="✨" maxlength="4">
        <input type="text" class="n" id="newName" placeholder="Tên hoạt động mới">
        <button class="btn primary" id="addAct">Thêm</button>
      </div>
    </div>

    <div class="section">
      <h3>Ngày bắt đầu</h3>
      <div class="edit-row">
        <input type="date" id="startDate">
      </div>
    </div>

    <div class="section">
      <h3>Sao lưu</h3>
      <div class="muted" style="font-size:13px">Dữ liệu chỉ nằm trên máy này. Thỉnh thoảng nên xuất file để sao lưu.</div>
      <div class="row-btns">
        <button class="btn" id="exportBtn">Xuất file</button>
        <button class="btn" id="importBtn">Nhập file</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "daily-tick-v1";
const DEFAULT_STATE = {
  start: "1996-02-26",
  activities: [
    { id: "study", emoji: "📚", name: "Học 25 phút" },
    { id: "sleep", emoji: "🌙", name: "Tắt đèn lên giường trước 22h" },
    { id: "exercise", emoji: "🏃", name: "Tập thể dục 25 phút" },
    { id: "other", emoji: "✨", name: "Việc có ích khác" },
  ],
  log: {}, // { "YYYY-MM-DD": { activityId: count } }
};

let state = load();
let viewDate = todayKey();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return structuredClone(DEFAULT_STATE);
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast("Không lưu được dữ liệu!"); }
}

// Dates are handled as local "YYYY-MM-DD" keys; day math goes through UTC to avoid DST drift.
function pad(n) { return String(n).padStart(2, "0"); }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function keyToUTC(k) { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); }
function addDays(k, n) { const d = new Date(keyToUTC(k) + n * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function daysBetween(a, b) { return Math.round((keyToUTC(b) - keyToUTC(a)) / 86400000); }
function fmtDate(k) { const [y, m, d] = k.split("-"); return `${d}/${m}/${y}`; }
function fmtNum(n) { return n.toLocaleString("vi-VN"); }
const WEEKDAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function weekday(k) { return WEEKDAYS[new Date(keyToUTC(k)).getUTCDay()]; }

function dayTotal(k) { return Object.values(state.log[k] || {}).reduce((s, n) => s + n, 0); }
function totalEarned() { return Object.keys(state.log).reduce((s, k) => s + dayTotal(k), 0); }
function ticksInLast(n) { let s = 0; const t = todayKey(); for (let i = 0; i < n; i++) s += dayTotal(addDays(t, -i)); return s; }

function changeTick(actId, delta) {
  const day = state.log[viewDate] || (state.log[viewDate] = {});
  const next = Math.max(0, (day[actId] || 0) + delta);
  if (next) day[actId] = next; else delete day[actId];
  if (!Object.keys(day).length) delete state.log[viewDate];
  save();
  render();
  if (delta > 0 && navigator.vibrate) navigator.vibrate(15);
}

function renderHero() {
  const today = todayKey();
  const required = daysBetween(state.start, today);
  const earned = totalEarned();
  const gap = required - earned;

  document.getElementById("dayNum").textContent = `Ngày ${fmtNum(required)}`;
  document.getElementById("since").textContent = `kể từ ${fmtDate(state.start)}`;
  document.getElementById("required").textContent = fmtNum(required);
  document.getElementById("earned").textContent = fmtNum(earned);
  document.getElementById("gap").textContent = fmtNum(Math.abs(gap));
  document.getElementById("gapLabel").textContent = gap > 0 ? "Còn nợ" : "Vượt trước";
  document.getElementById("gapBox").className = "stat " + (gap > 0 ? "debt" : "ahead");
  document.getElementById("progress").style.width = Math.min(100, required ? earned / required * 100 : 100) + "%";

  const todayTicks = dayTotal(today);
  const net = todayTicks - 1;
  const rate7 = ticksInLast(7) / 7;
  const rate30 = ticksInLast(30) / 30;

  let lines = [];
  lines.push(net > 0
    ? `Hôm nay <span class="pill good">+${todayTicks}</span> → khoảng cách giảm ${net}.`
    : net === 0
      ? `Hôm nay <span class="pill good">+1</span> → giữ được tốc độ, khoảng cách không tăng.`
      : `Hôm nay chưa có tick nào <span class="pill bad">khoảng cách +1</span>`);
  lines.push(`Trung bình 7 ngày: <b class="num">${rate7.toFixed(1)}</b>/ngày · 30 ngày: <b class="num">${rate30.toFixed(1)}</b>/ngày`);
  if (gap > 0) {
    if (rate30 > 1) {
      const days = Math.ceil(gap / (rate30 - 1));
      lines.push(`Với tốc độ 30 ngày, bạn sẽ đuổi kịp sau <b class="num">${fmtNum(days)}</b> ngày (khoảng ${fmtDate(addDays(today, days))}).`);
    } else {
      lines.push(`Cần trung bình <b>trên 1 tick/ngày</b> thì khoảng cách mới bắt đầu thu hẹp.`);
    }
  }
  document.getElementById("pace").innerHTML = lines.map(l => `<div style="margin-top:4px">${l}</div>`).join("");
}

function renderLog() {
  const today = todayKey();
  const offset = daysBetween(today, viewDate);
  const label = offset === 0 ? "Hôm nay" : offset === -1 ? "Hôm qua" : `${weekday(viewDate)}, ${fmtDate(viewDate)}`;
  document.getElementById("dateLabel").innerHTML = `${label}${offset >= -1 ? `<small>${weekday(viewDate)}, ${fmtDate(viewDate)}</small>` : ""}`;
  document.getElementById("nextDay").disabled = offset >= 0;
  document.getElementById("prevDay").disabled = viewDate <= state.start;

  const total = dayTotal(viewDate);
  document.getElementById("dayTotal").innerHTML = `<b class="num">${total}</b> tick ${total >= 1 ? "✅" : ""}`;

  const day = state.log[viewDate] || {};
  // Archived activities still show on days where they were logged, so their ticks can be undone.
  const acts = state.activities.filter(a => !a.archived || day[a.id]);
  const box = document.getElementById("acts");
  box.innerHTML = "";
  for (const a of acts) {
    const c = day[a.id] || 0;
    const row = document.createElement("div");
    row.className = "act";
    row.innerHTML = `
      <button class="main"><span class="emoji">${esc(a.emoji)}</span><span>${esc(a.name)}</span></button>
      <span class="count num ${c ? "on" : ""}">${c}</span>
      <button class="round minus" ${c ? "" : "disabled"} aria-label="Bớt">−</button>
      <button class="round plus" aria-label="Thêm">+</button>`;
    row.querySelector(".main").onclick = () => changeTick(a.id, 1);
    row.querySelector(".plus").onclick = () => changeTick(a.id, 1);
    row.querySelector(".minus").onclick = () => changeTick(a.id, -1);
    box.appendChild(row);
  }
}

function renderChart() {
  const today = todayKey();
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(today, -i));
  const vals = days.map(dayTotal);
  const max = Math.max(2, ...vals) * 1.15; // headroom for value labels
  const chart = document.getElementById("chart");
  chart.innerHTML = `<div class="goal" style="bottom:${112 / max}px"></div>` +
    days.map((k, i) => `
      <div class="col">
        <div class="bar ${vals[i] ? "" : "zero"}" style="height:${(vals[i] / max) * 100}%"><div class="v num">${vals[i] || ""}</div></div>
      </div>`).join("");
  document.getElementById("xlabels").innerHTML = days.map(k => `<span>${k.slice(8)}</span>`).join("");
}

function renderSettings() {
  const box = document.getElementById("editActs");
  box.innerHTML = "";
  for (const a of state.activities.filter(a => !a.archived)) {
    const row = document.createElement("div");
    row.className = "edit-row";
    row.innerHTML = `
      <input type="text" class="e" maxlength="4" value="${esc(a.emoji)}">
      <input type="text" class="n" value="${esc(a.name)}">
      <button class="btn danger" aria-label="Xoá">✕</button>`;
    const [e, n] = row.querySelectorAll("input");
    e.onchange = () => { a.emoji = e.value.trim() || "•"; save(); render(); };
    n.onchange = () => { if (n.value.trim()) { a.name = n.value.trim(); save(); render(); } };
    row.querySelector("button").onclick = () => {
      if (!confirm(`Xoá "${a.name}"? Các tick cũ vẫn được giữ.`)) return;
      a.archived = true; save(); render();
    };
    box.appendChild(row);
  }
  document.getElementById("startDate").value = state.start;
}

function render() { renderHero(); renderLog(); renderChart(); renderSettings(); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }

document.getElementById("prevDay").onclick = () => { viewDate = addDays(viewDate, -1); renderLog(); };
document.getElementById("nextDay").onclick = () => { if (viewDate < todayKey()) { viewDate = addDays(viewDate, 1); renderLog(); } };

document.getElementById("addAct").onclick = () => {
  const name = document.getElementById("newName").value.trim();
  if (!name) return;
  const emoji = document.getElementById("newEmoji").value.trim() || "✨";
  state.activities.push({ id: "a" + Date.now().toString(36), emoji, name });
  document.getElementById("newName").value = "";
  document.getElementById("newEmoji").value = "";
  save(); render(); toast("Đã thêm hoạt động");
};

document.getElementById("startDate").onchange = e => {
  if (!e.target.value || e.target.value > todayKey()) return;
  state.start = e.target.value; save(); render();
};

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `daily-tick-${todayKey()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.start || !Array.isArray(data.activities) || typeof data.log !== "object") throw 0;
    if (!confirm("Thay toàn bộ dữ liệu hiện tại bằng file này?")) return;
    state = data; save(); render(); toast("Đã nhập dữ liệu");
  } catch (err) { toast("File không hợp lệ"); }
  e.target.value = "";
};

// Roll over to the new day if the app stays open past midnight.
let lastToday = todayKey();
function checkRollover() {
  const t = todayKey();
  if (t !== lastToday) { if (viewDate === lastToday) viewDate = t; lastToday = t; render(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkRollover(); });
setInterval(checkRollover, 60000);

render();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
